name: Migrate Vercel Blobs to Google Cloud Storage

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually copy blobs (false = dry run only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCS_BUCKET VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install API dependencies
        working-directory: api
        run: npx -y pnpm@10.13.1 install --frozen-lockfile

      - name: Inspect Google cutover configuration without credentials or user data
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          set -euo pipefail
          gcloud run services describe fc-teugn-backend --project "$GCP_PROJECT_ID" --region europe-west3 --format=json > /tmp/run.json
          jq '{service:.metadata.name, ready:.status.latestReadyRevisionName, traffic:.status.traffic, url:.status.url, serviceAccount:.spec.template.spec.serviceAccountName, timeout:.spec.template.spec.timeoutSeconds, storage:[.spec.template.spec.containers[0].env[] | select(.name == "OBJECT_STORAGE_PROVIDER" or .name == "OBJECT_STORAGE_BUCKET")]}' /tmp/run.json
          gcloud scheduler jobs list --project "$GCP_PROJECT_ID" --location europe-west3 --format='table(name,state,schedule,attemptDeadline)'
          if gcloud storage buckets describe "gs://$GCS_BUCKET" --format=json > /tmp/bucket.json 2>/dev/null; then
            jq '{location, uniform_bucket_level_access, public_access_prevention, soft_delete_policy, versioning_enabled, retention_policy}' /tmp/bucket.json
          else
            echo 'Bucket policy inspection unavailable to deployment service account.'
          fi

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@59.13.1
          vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1

      - name: Run blob migration inside Vercel environment
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OBJECT_STORAGE_BUCKET: ${{ vars.GCS_BUCKET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXECUTE_INPUT: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          if [ "$EXECUTE_INPUT" = "true" ]; then
            vercel env run --environment=production --token "$VERCEL_TOKEN" -- \
              node api/scripts/migrate-vercel-blobs-to-gcs.mjs --execute --verify
          else
            vercel env run --environment=production --token "$VERCEL_TOKEN" -- \
              node api/scripts/migrate-vercel-blobs-to-gcs.mjs --verify
          fi

      - name: Remove temporary Vercel credential files
        if: always()
        run: rm -f .env.local
