name: Inspect GCP Secret Fingerprints

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/secret-fingerprints'

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect and clean known placeholder versions
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          placeholder_hash='3930fb7a9a99cc3dae417b58f54434ef8fb795ef4e1229eaba49b37e8b48424a'
          for secret in DATABASE_URL ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET; do
            echo "SECRET ${secret}"
            if ! gcloud secrets describe "$secret" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo '  missing'
              continue
            fi
            while IFS= read -r version; do
              [ -n "$version" ] || continue
              value="$(gcloud secrets versions access "$version" --secret "$secret" --project "$GCP_PROJECT_ID" 2>/dev/null || true)"
              hash="$(printf '%s' "$value" | sha256sum | awk '{print $1}')"
              state="$(gcloud secrets versions describe "$version" --secret "$secret" --project "$GCP_PROJECT_ID" --format='value(state)')"
              if [ "$hash" = "$placeholder_hash" ] && [ "$state" = 'ENABLED' ]; then
                gcloud secrets versions disable "$version" --secret "$secret" --project "$GCP_PROJECT_ID" --quiet >/dev/null
                state='DISABLED_PLACEHOLDER'
              fi
              echo "  version=${version} state=${state} sha256=${hash}"
            done < <(gcloud secrets versions list "$secret" --project "$GCP_PROJECT_ID" --format='value(name)' | sed 's#.*/##')
          done
