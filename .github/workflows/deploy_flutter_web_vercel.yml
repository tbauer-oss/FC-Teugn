name: Deploy web transition bridge

on:
  workflow_dispatch:
    inputs:
      production:
        description: Replace the existing production deployment with the Google bridge
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: legacy-web-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-bridge/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install deployment CLI
        run: npm install -g vercel@59.13.1
      - name: Assemble static routing output without application code or functions
        run: |
          mkdir -p .vercel/output
          cp config.json .vercel/output/config.json
          cp -R static .vercel/output/static
      - name: Deploy transition bridge to the existing project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail
          vercel link --project fc_teugn_app --scope tobis-projects-7d669891 --yes --token "$VERCEL_TOKEN" >/dev/null
          args=(--prebuilt --yes --scope tobis-projects-7d669891 --token "$VERCEL_TOKEN")
          if [ "$PRODUCTION" = true ]; then args+=(--prod); fi
          vercel deploy "${args[@]}" > bridge-url.txt
          url="$(tail -n 1 bridge-url.txt)"
          echo "Transition bridge: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve deployment URL
        uses: actions/upload-artifact@v7
        with:
          name: legacy-web-bridge-url
          path: legacy-bridge/web/bridge-url.txt
