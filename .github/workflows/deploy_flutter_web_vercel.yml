name: Deploy Flutter Web to Vercel (Legacy)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fc_teugn_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter web (release)
        run: flutter build web --release

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy legacy Vercel web manually
        working-directory: fc_teugn_app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"
