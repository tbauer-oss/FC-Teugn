name: Deploy Flutter Web to Firebase Hosting

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/firebase-hosting-deploy'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-flutter-firebase
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required repository variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "Repository variable $name is required." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: Flutter pub get
        working-directory: fc_teugn_app
        run: flutter pub get

      - name: Build Flutter web for Firebase parallel test
        working-directory: fc_teugn_app
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL=https://fc-teugn.web.app/api

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firebase Hosting
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
