name: Deploy Backend API to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (api)
        working-directory: api
        run: npx -y pnpm@10.13.1 install --frozen-lockfile
        
      - name: Build API (api workspace)
        working-directory: api
        run: npx -y pnpm@10.13.1 run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link backend Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --local-config api/vercel.json

      - name: Deploy to Vercel (Backend API)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN" --local-config api/vercel.json
