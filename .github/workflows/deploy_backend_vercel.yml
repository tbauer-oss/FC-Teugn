name: Deploy Backend API to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies (api)
        working-directory: api
        run: npx -y pnpm@10.13.1 install --frozen-lockfile
        
      - name: Build API (api workspace)
        working-directory: api
        run: npx -y pnpm@10.13.1 run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link backend Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --local-config api/vercel.json

      - name: Deploy to Vercel (Backend API)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if vercel deploy --prod --yes --token "$VERCEL_TOKEN" --local-config api/vercel.json; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Backend deployment failed after $attempt attempts."
              exit 1
            fi

            echo "Backend deployment attempt $attempt hit a temporary failure; retrying in 30 seconds."
            sleep 30
          done
