name: Migrate Vercel Environment to Google Secret Manager

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/secrets'

permissions:
  contents: read
  id-token: write

jobs:
  migrate-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Copy decrypted Vercel production secrets to Secret Manager
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: tobis-projects-7d669891
          VERCEL_PROJECT: fc-teugn-backend
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const project = process.env.GCP_PROJECT_ID;
          const vercelToken = process.env.VERCEL_TOKEN;
          const teamSlug = process.env.VERCEL_TEAM_SLUG;
          const vercelProject = process.env.VERCEL_PROJECT;
          const requiredNames = [
            'DATABASE_URL',
            'ACCESS_TOKEN_SECRET',
            'REFRESH_TOKEN_SECRET',
            'CRON_SECRET',
            'RESEND_API_KEY',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
          ];

          function targetIncludesProduction(item) {
            const target = item?.target;
            return Array.isArray(target)
              ? target.includes('production')
              : target === 'production';
          }

          function gcloud(args, options = {}) {
            return execFileSync('gcloud', args, {
              encoding: options.encoding,
              input: options.input,
              stdio: options.stdio ?? (options.encoding ? undefined : 'inherit'),
            });
          }

          async function main() {
            const endpoint = new URL(
              `https://api.vercel.com/v10/projects/${encodeURIComponent(vercelProject)}/env`,
            );
            endpoint.searchParams.set('decrypt', 'true');
            endpoint.searchParams.set('source', 'vercel-cli:pull');
            endpoint.searchParams.set('slug', teamSlug);

            const response = await fetch(endpoint, {
              headers: { Authorization: `Bearer ${vercelToken}` },
            });
            if (!response.ok) {
              throw new Error(`Vercel environment API returned HTTP ${response.status}.`);
            }

            const payload = await response.json();
            const envs = Array.isArray(payload?.envs) ? payload.envs : [];
            const values = new Map();

            // Validate the complete source before changing any Google secret.
            for (const name of requiredNames) {
              const candidates = envs.filter(
                (item) => item?.key === name && targetIncludesProduction(item),
              );
              const item = candidates.find((candidate) => !candidate.gitBranch) ?? candidates[0];
              const value = item?.value;
              if (typeof value !== 'string' || !value || value === '[SENSITIVE]') {
                throw new Error(`Vercel did not provide a decrypted production value for ${name}.`);
              }
              values.set(name, value);
            }

            for (const [name, value] of values) {
              try {
                gcloud(['secrets', 'describe', name, '--project', project], { stdio: 'ignore' });
              } catch {
                gcloud([
                  'secrets', 'create', name,
                  '--project', project,
                  '--replication-policy', 'automatic',
                ]);
              }

              gcloud([
                'secrets', 'versions', 'add', name,
                '--project', project,
                '--data-file=-',
              ], { input: value, stdio: ['pipe', 'inherit', 'inherit'] });

              // Clean up only known placeholder versions produced by the older
              // Vercel CLI pull approach. Never disable an unknown real value.
              const versionNames = String(gcloud([
                'secrets', 'versions', 'list', name,
                '--project', project,
                '--filter=state:ENABLED',
                '--format=value(name)',
              ], { encoding: 'utf8' }) || '')
                .trim()
                .split(/\r?\n/)
                .filter(Boolean);

              for (const versionName of versionNames) {
                const version = versionName.split('/').pop();
                if (!version || version === 'latest') continue;
                let existing;
                try {
                  existing = String(gcloud([
                    'secrets', 'versions', 'access', version,
                    '--secret', name,
                    '--project', project,
                  ], { encoding: 'utf8' }) || '');
                } catch {
                  continue;
                }
                if (existing.trim() === '[SENSITIVE]') {
                  gcloud([
                    'secrets', 'versions', 'disable', version,
                    '--secret', name,
                    '--project', project,
                    '--quiet',
                  ], { stdio: 'ignore' });
                }
              }

              console.log(`Migrated ${name}`);
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : 'Secret migration failed.');
            process.exitCode = 1;
          });
          NODE
