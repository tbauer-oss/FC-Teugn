name: Migrate Vercel Environment to Google Secret Manager

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/secrets'

permissions:
  contents: read
  id-token: write

jobs:
  migrate-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install and link Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN"

      - name: Migrate secrets from Vercel production runtime
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/migrate-vercel-secrets.cjs <<'NODE'
          const { execFileSync } = require('node:child_process');

          const project = process.env.GCP_PROJECT_ID;
          const requiredNames = [
            'DATABASE_URL',
            'ACCESS_TOKEN_SECRET',
            'REFRESH_TOKEN_SECRET',
            'CRON_SECRET',
            'RESEND_API_KEY',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
          ];

          function gcloud(args, options = {}) {
            return execFileSync('gcloud', args, {
              encoding: options.encoding,
              input: options.input,
              stdio: options.stdio ?? (options.encoding ? undefined : 'inherit'),
            });
          }

          // Validate everything before writing anything to Google.
          const values = new Map();
          for (const name of requiredNames) {
            const value = process.env[name];
            if (typeof value !== 'string' || !value || value === '[SENSITIVE]') {
              throw new Error(`Vercel runtime did not provide a usable production value for ${name}.`);
            }
            values.set(name, value);
          }

          for (const [name, value] of values) {
            try {
              gcloud(['secrets', 'describe', name, '--project', project], { stdio: 'ignore' });
            } catch {
              gcloud([
                'secrets', 'create', name,
                '--project', project,
                '--replication-policy', 'automatic',
              ]);
            }

            gcloud([
              'secrets', 'versions', 'add', name,
              '--project', project,
              '--data-file=-',
            ], { input: value, stdio: ['pipe', 'inherit', 'inherit'] });

            // Disable only placeholder versions created by the obsolete env-pull
            // approach. Unknown previous real values are left untouched.
            const versionNames = String(gcloud([
              'secrets', 'versions', 'list', name,
              '--project', project,
              '--filter=state:ENABLED',
              '--format=value(name)',
            ], { encoding: 'utf8' }) || '')
              .trim()
              .split(/\r?\n/)
              .filter(Boolean);

            for (const versionName of versionNames) {
              const version = versionName.split('/').pop();
              if (!version) continue;
              let existing;
              try {
                existing = String(gcloud([
                  'secrets', 'versions', 'access', version,
                  '--secret', name,
                  '--project', project,
                ], { encoding: 'utf8' }) || '');
              } catch {
                continue;
              }
              if (existing.trim() === '[SENSITIVE]') {
                gcloud([
                  'secrets', 'versions', 'disable', version,
                  '--secret', name,
                  '--project', project,
                  '--quiet',
                ], { stdio: 'ignore' });
              }
            }

            console.log(`Migrated ${name}`);
          }
          NODE

          vercel env run --environment=production --token "$VERCEL_TOKEN" -- \
            node /tmp/migrate-vercel-secrets.cjs
          rm -f /tmp/migrate-vercel-secrets.cjs
