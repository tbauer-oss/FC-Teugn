name: Migrate Vercel Environment to Google Secret Manager

on:
  workflow_dispatch:
  push:
    branches:
      - migration/firebase-cloud-run
    paths:
      - '.github/migration-triggers/secrets'

permissions:
  contents: read
  id-token: write

jobs:
  migrate-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dotenv parser
        run: npm install --no-save dotenv@16

      - name: Pull current Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN"
          vercel env pull /tmp/fc-teugn-vercel.env --environment=production --yes --token "$VERCEL_TOKEN"

      - name: Copy selected secrets to Secret Manager
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const dotenv = require('dotenv');

          const project = process.env.GCP_PROJECT_ID;
          const source = dotenv.parse(fs.readFileSync('/tmp/fc-teugn-vercel.env'));
          const names = [
            'DATABASE_URL',
            'ACCESS_TOKEN_SECRET',
            'REFRESH_TOKEN_SECRET',
            'EMERGENCY_ACCESS_SECRET',
            'CRON_SECRET',
            'RESEND_API_KEY',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
          ];

          for (const name of names) {
            const value = source[name];
            if (!value) {
              throw new Error(`Required Vercel environment variable ${name} is missing.`);
            }

            try {
              execFileSync('gcloud', ['secrets', 'describe', name, '--project', project], {
                stdio: 'ignore',
              });
            } catch {
              execFileSync(
                'gcloud',
                ['secrets', 'create', name, '--project', project, '--replication-policy', 'automatic'],
                { stdio: 'inherit' },
              );
            }

            execFileSync(
              'gcloud',
              ['secrets', 'versions', 'add', name, '--project', project, '--data-file=-'],
              { input: value, stdio: ['pipe', 'inherit', 'inherit'] },
            );
            console.log(`Migrated ${name}`);
          }
          NODE

      - name: Remove temporary Vercel environment file
        if: always()
        run: rm -f /tmp/fc-teugn-vercel.env
