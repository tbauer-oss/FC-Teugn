name: Create GCP Runtime Secrets

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/runtime-secrets'

permissions:
  contents: read
  id-token: write

jobs:
  create-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create rotatable runtime secrets in Google Secret Manager
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          ensure_secret() {
            local name="$1"
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$GCP_PROJECT_ID" --replication-policy automatic >/dev/null
            fi
          }

          add_random_secret() {
            local name="$1"
            ensure_secret "$name"
            node -e "process.stdout.write(require('crypto').randomBytes(64).toString('hex'))" \
              | gcloud secrets versions add "$name" --project "$GCP_PROJECT_ID" --data-file=- >/dev/null
            echo "Created a new ${name} version."
          }

          add_random_secret ACCESS_TOKEN_SECRET
          add_random_secret REFRESH_TOKEN_SECRET
          add_random_secret CRON_SECRET

          ensure_secret VAPID_PUBLIC_KEY
          ensure_secret VAPID_PRIVATE_KEY
          npm install --no-save web-push@3.6.7 >/dev/null 2>&1
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const webpush = require('web-push');
          const project = process.env.GCP_PROJECT_ID;
          const pair = webpush.generateVAPIDKeys();
          for (const [name, value] of [
            ['VAPID_PUBLIC_KEY', pair.publicKey],
            ['VAPID_PRIVATE_KEY', pair.privateKey],
          ]) {
            execFileSync('gcloud', [
              'secrets', 'versions', 'add', name,
              '--project', project,
              '--data-file=-',
            ], { input: value, stdio: ['pipe', 'ignore', 'inherit'] });
          }
          NODE
          echo 'Created a new VAPID key pair.'
