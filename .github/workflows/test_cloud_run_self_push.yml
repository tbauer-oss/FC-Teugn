name: Test Cloud Run Self Push

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/self-push'

permissions:
  contents: read
  id-token: write

jobs:
  self-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install API dependencies
        working-directory: api
        run: npx -y pnpm@10.13.1 install --frozen-lockfile

      - name: Send one push only to the approved SUPER_ADMIN
        working-directory: api
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$GCP_PROJECT_ID")"
          export ACCESS_TOKEN_SECRET="$(gcloud secrets versions access latest --secret=ACCESS_TOKEN_SECRET --project="$GCP_PROJECT_ID")"
          node <<'NODE'
          const jwt = require('jsonwebtoken');
          const { PrismaClient } = require('@prisma/client');

          (async () => {
            const prisma = new PrismaClient();
            try {
              const users = await prisma.user.findMany({
                where: { role: 'SUPER_ADMIN', status: 'APPROVED' },
                select: { id: true, teamId: true },
              });
              if (users.length !== 1) {
                throw new Error(`Expected exactly one approved SUPER_ADMIN, found ${users.length}.`);
              }
              const user = users[0];
              const token = jwt.sign(
                {
                  id: user.id,
                  role: 'SUPER_ADMIN',
                  status: 'APPROVED',
                  teamId: user.teamId,
                },
                process.env.ACCESS_TOKEN_SECRET,
                { expiresIn: '5m' },
              );

              const response = await fetch(
                'https://fc-teugn.web.app/api/notifications/admin/test-push/self',
                {
                  method: 'POST',
                  headers: {
                    authorization: `Bearer ${token}`,
                    'content-type': 'application/json',
                    'idempotency-key': `cloud-migration-self-push-${Date.now()}`,
                  },
                  body: JSON.stringify({ scenario: 'TRAINING' }),
                },
              );
              const raw = await response.text();
              let body;
              try { body = JSON.parse(raw); } catch { body = { message: raw }; }
              if (!response.ok) {
                throw new Error(`Self-push endpoint failed with HTTP ${response.status}: ${body.message || 'unknown error'}`);
              }
              const safeSummary = {
                recipients: body.recipients,
                subscriptions: body.subscriptions,
                sent: body.sent,
                failed: body.failed,
                pending: body.pending,
                skipped: body.skipped,
                byPlatform: body.byPlatform,
                errors: body.errors,
              };
              console.log(JSON.stringify(safeSummary, null, 2));
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          unset DATABASE_URL ACCESS_TOKEN_SECRET
