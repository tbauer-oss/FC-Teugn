name: Test Vercel Blob CLI Access

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/blob-oidc'

permissions:
  contents: read

jobs:
  test-blob-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install and link Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1
      - name: Verify private Blob CLI access without exposing paths
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if ! vercel blob list --limit 1 --token "$VERCEL_TOKEN" >/tmp/blob-list.out 2>/tmp/blob-list.err; then
            echo 'Vercel Blob CLI listing failed.' >&2
            exit 1
          fi
          if [ ! -s /tmp/blob-list.out ] && [ ! -s /tmp/blob-list.err ]; then
            echo 'Vercel Blob CLI returned no listing output.' >&2
            exit 1
          fi
          echo 'Vercel Blob CLI access is available with the linked project token.'
          rm -f /tmp/blob-list.out /tmp/blob-list.err
