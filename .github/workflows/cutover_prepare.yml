name: Prepare Production Cutover

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/cutover-prepare'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install API dependencies
        working-directory: api
        run: npx -y pnpm@10.13.1 install --frozen-lockfile

      - name: Final copy-only Vercel Blob sync to GCS
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OBJECT_STORAGE_BUCKET: ${{ vars.GCS_BUCKET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          vercel env run --environment=production --token "$VERCEL_TOKEN" -- \
            node api/scripts/migrate-vercel-blobs-to-gcs.mjs --execute
          rm -f .env.local

      - name: Prepare Cloud Scheduler but keep it paused
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          REGION=europe-west3
          JOB=fc-teugn-reminders
          SERVICE_URL="$(gcloud run services describe fc-teugn-backend --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          CRON_SECRET="$(gcloud secrets versions access latest --secret=CRON_SECRET --project="$GCP_PROJECT_ID")"
          URI="${SERVICE_URL}/internal/cron/reminders"
          if gcloud scheduler jobs describe "$JOB" --project "$GCP_PROJECT_ID" --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB" \
              --project "$GCP_PROJECT_ID" --location "$REGION" \
              --schedule '*/5 * * * *' --time-zone 'Europe/Berlin' \
              --uri "$URI" --http-method GET \
              --update-headers "Authorization=Bearer ${CRON_SECRET}" \
              --attempt-deadline 30s --quiet
          else
            gcloud scheduler jobs create http "$JOB" \
              --project "$GCP_PROJECT_ID" --location "$REGION" \
              --schedule '*/5 * * * *' --time-zone 'Europe/Berlin' \
              --uri "$URI" --http-method GET \
              --headers "Authorization=Bearer ${CRON_SECRET}" \
              --attempt-deadline 30s --quiet
          fi
          unset CRON_SECRET
          gcloud scheduler jobs pause "$JOB" --project "$GCP_PROJECT_ID" --location "$REGION" --quiet || true
          echo 'Cloud Scheduler prepared and PAUSED.'

      - name: Register Firebase Hosting custom domain and show required DNS
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          DOMAIN='app.fc-teugn-talents.de'
          SITE_ID="$GCP_PROJECT_ID"
          BASE="https://firebasehosting.googleapis.com/v1beta1/projects/${GCP_PROJECT_ID}/sites/${SITE_ID}/customDomains"
          TOKEN="$(gcloud auth print-access-token)"
          STATUS="$(curl -sS -o /tmp/custom-domain.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "${BASE}/${DOMAIN}")"
          if [ "$STATUS" = '404' ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{}' \
              "${BASE}?customDomainId=${DOMAIN}" > /tmp/create-domain.json
            OP_NAME="$(node -e "const x=require('/tmp/create-domain.json'); process.stdout.write(x.name||'')")"
            if [ -n "$OP_NAME" ]; then
              for _ in $(seq 1 20); do
                curl --fail --silent --show-error \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "https://firebasehosting.googleapis.com/v1beta1/${OP_NAME}" > /tmp/domain-operation.json
                DONE="$(node -e "const x=require('/tmp/domain-operation.json'); process.stdout.write(String(x.done===true))")"
                [ "$DONE" = 'true' ] && break
                sleep 3
              done
            fi
          elif [ "$STATUS" != '200' ]; then
            cat /tmp/custom-domain.json
            echo "Unexpected custom-domain HTTP status: $STATUS" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" \
            "${BASE}/${DOMAIN}" > /tmp/custom-domain-final.json
          node <<'NODE'
          const x = require('/tmp/custom-domain-final.json');
          console.log(JSON.stringify({
            name: x.name,
            hostState: x.hostState,
            ownershipState: x.ownershipState,
            requiredDnsUpdates: x.requiredDnsUpdates,
            issues: x.issues || [],
          }, null, 2));
          NODE
