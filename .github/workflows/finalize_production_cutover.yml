name: Finalize Production Cutover

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/migration-triggers/cutover-finalize'

permissions:
  contents: read
  id-token: write

concurrency:
  group: finalize-production-cutover
  cancel-in-progress: false

env:
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: fc-teugn-backend
  ARTIFACT_REPOSITORY: fc-teugn
  PRODUCTION_APP_URL: https://app.fc-teugn-talents.de

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify custom domain is fully live before changing cron ownership
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          DOMAIN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://firebasehosting.googleapis.com/v1beta1/projects/${GCP_PROJECT_ID}/sites/${GCP_PROJECT_ID}/customDomains/app.fc-teugn-talents.de")"
          HOST_STATE="$(printf '%s' "$DOMAIN_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(x.hostState||'')})")"
          OWNERSHIP_STATE="$(printf '%s' "$DOMAIN_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(x.ownershipState||'')})")"
          test "$HOST_STATE" = 'HOST_ACTIVE'
          test "$OWNERSHIP_STATE" = 'OWNERSHIP_ACTIVE'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output /tmp/custom-index.html "$PRODUCTION_APP_URL/"
          test -s /tmp/custom-index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "$PRODUCTION_APP_URL/api/" | tee /tmp/custom-api.json
          grep -q '"status":"ok"' /tmp/custom-api.json
          echo 'Custom domain, HTTPS and Firebase -> Cloud Run API rewrite are live.'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: api
        run: npx -y pnpm@10.13.1 install --frozen-lockfile

      - name: Apply Prisma migrations
        working-directory: api
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$GCP_PROJECT_ID")"
          npx -y pnpm@10.13.1 exec prisma migrate deploy
          unset DATABASE_URL

      - name: Build and push final Cloud Run image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${CLOUD_RUN_SERVICE}:cutover-${GITHUB_SHA}"
          docker build -f api/Dockerfile -t "$IMAGE" api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy final backend revision to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          set -euo pipefail
          RUNTIME_SERVICE_ACCOUNT="fc-teugn-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 8080 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=production,APP_ENVIRONMENT=production,OBJECT_STORAGE_PROVIDER=gcs,OBJECT_STORAGE_BUCKET=${GCS_BUCKET},FIREBASE_PROJECT_ID=${GCP_PROJECT_ID},PUBLIC_APP_URL=${PRODUCTION_APP_URL},CORS_ORIGINS=https://app.fc-teugn-talents.de|https://fc-teugn.web.app|https://fc-teugn.firebaseapp.com,RESEND_ACCOUNT_FROM_EMAIL=FC Teugn Talents <account@mail.fc-teugn-talents.de>,RESEND_SUPPORT_FROM_EMAIL=FC Teugn Talents Support <support@mail.fc-teugn-talents.de>,VAPID_SUBJECT=mailto:info@fc-teugn.de,MESSENGER_BACKUP_RETENTION_DAYS=30" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,ACCESS_TOKEN_SECRET=ACCESS_TOKEN_SECRET:latest,REFRESH_TOKEN_SECRET=REFRESH_TOKEN_SECRET:latest,CRON_SECRET=CRON_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest" \
            --quiet
          CLOUD_RUN_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          echo "CLOUD_RUN_URL=$CLOUD_RUN_URL" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$CLOUD_RUN_URL/" \
            | tee /tmp/cloud-run-health.json
          grep -q '"status":"ok"' /tmp/cloud-run-health.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: Build production Flutter web against stable API URL
        working-directory: fc_teugn_app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL=https://app.fc-teugn-talents.de/api

      - name: Deploy production Flutter web to Firebase Hosting
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools@latest
          firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            --output /tmp/final-index.html "$PRODUCTION_APP_URL/"
          test -s /tmp/final-index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "$PRODUCTION_APP_URL/api/" | tee /tmp/final-api.json
          grep -q '"status":"ok"' /tmp/final-api.json
          echo 'Final Firebase production web deployment is healthy.'

      - name: Ensure Firebase Admin service account can use GCS for legacy Android bridge
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r SERVICE_ACCOUNT; do
            [ -z "$SERVICE_ACCOUNT" ] && continue
            FOUND=1
            gcloud storage buckets add-iam-policy-binding "gs://${GCS_BUCKET}" \
              --member "serviceAccount:${SERVICE_ACCOUNT}" \
              --role roles/storage.objectAdmin \
              --quiet >/dev/null
          done < <(gcloud iam service-accounts list --project "$GCP_PROJECT_ID" \
            --filter='email~firebase-adminsdk' --format='value(email)')
          if [ "$FOUND" -eq 0 ]; then
            echo 'No firebase-adminsdk service account found; continuing with existing Firebase IAM.'
          else
            echo 'Firebase Admin SDK service account has GCS object access.'
          fi

      - name: Configure Vercel legacy backend to use GCS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel link --project fc-teugn-backend --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1
          for NAME in OBJECT_STORAGE_PROVIDER OBJECT_STORAGE_BUCKET FIREBASE_PROJECT_ID PUBLIC_APP_URL; do
            vercel env rm "$NAME" production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          done
          printf '%s\n' 'gcs' | vercel env add OBJECT_STORAGE_PROVIDER production --token "$VERCEL_TOKEN" >/dev/null
          printf '%s\n' "$GCS_BUCKET" | vercel env add OBJECT_STORAGE_BUCKET production --token "$VERCEL_TOKEN" >/dev/null
          printf '%s\n' "$GCP_PROJECT_ID" | vercel env add FIREBASE_PROJECT_ID production --token "$VERCEL_TOKEN" >/dev/null
          printf '%s\n' "$PRODUCTION_APP_URL" | vercel env add PUBLIC_APP_URL production --token "$VERCEL_TOKEN" >/dev/null
          echo 'Legacy Vercel backend production environment now points object storage to GCS.'

      - name: Deploy legacy Vercel backend compatibility bridge without cron
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # api/vercel.json intentionally contains no cron after the migration.
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --local-config api/vercel.json >/dev/null
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --local-config api/vercel.json | tee /tmp/vercel-deploy.txt
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            https://fc-teugn-backend.vercel.app/ | tee /tmp/vercel-health.json
          grep -q '"status":"ok"' /tmp/vercel-health.json
          NO_COLOR=1 vercel crons ls --token "$VERCEL_TOKEN" --format=json \
            | tee /tmp/vercel-crons.txt || true
          if grep -q '/internal/cron/reminders' /tmp/vercel-crons.txt; then
            echo 'Legacy Vercel reminder cron is still present; Google Scheduler will NOT be resumed.' >&2
            exit 1
          fi
          echo 'Legacy Vercel backend remains healthy and its reminder cron is absent.'

      - name: Resume Google Cloud Scheduler only after Vercel cron is absent
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud scheduler jobs resume fc-teugn-reminders \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --quiet || true
          STATE="$(gcloud scheduler jobs describe fc-teugn-reminders \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format='value(state)')"
          test "$STATE" = 'ENABLED'
          echo 'Google Cloud Scheduler is ENABLED; reminder ownership has moved from Vercel to Google.'

      - name: Final production smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output /tmp/production-index.html "$PRODUCTION_APP_URL/"
          test -s /tmp/production-index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "$PRODUCTION_APP_URL/api/" | tee /tmp/production-api.json
          grep -q '"status":"ok"' /tmp/production-api.json
          echo 'PRODUCTION_CUTOVER_COMPLETE=true'
