name: Validate FC Teugn App

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fc_teugn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fc_teugn
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
      EMERGENCY_ACCESS_SECRET: ci-emergency-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npx -y pnpm@10.13.1 install --frozen-lockfile

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run backend tests
        run: npm test

      - name: Prepare E2E database
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Run complete HTTP E2E acceptance
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4000/ > /dev/null
          npm run test:e2e

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fc_teugn_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format sources for validation
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --release

      - name: Create temporary Android release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-release.jks \
            -storepass changeit \
            -keypass changeit \
            -alias fc-teugn-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FC Teugn CI, OU=Jugend, O=FC Teugn, C=DE"
          printf '%s\n' \
            'storePassword=changeit' \
            'keyPassword=changeit' \
            'keyAlias=fc-teugn-ci' \
            'storeFile=ci-release.jks' \
            > android/key.properties

      - name: Build signed Android App Bundle
        env:
          FC_TEUGN_REQUIRE_RELEASE_SIGNING: 'true'
        run: flutter build appbundle --release
