name: Validate FC Teugn App

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fc_teugn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npx -y pnpm@10.13.1 install --frozen-lockfile

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run backend tests
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fc_teugn_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format sources for validation
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --release

      - name: Create temporary Android release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-release.jks \
            -storepass changeit \
            -keypass changeit \
            -alias fc-teugn-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FC Teugn CI, OU=Jugend, O=FC Teugn, C=DE"
          printf '%s\n' \
            'storePassword=changeit' \
            'keyPassword=changeit' \
            'keyAlias=fc-teugn-ci' \
            'storeFile=ci-release.jks' \
            > android/key.properties

      - name: Build signed Android App Bundle
        env:
          FC_TEUGN_REQUIRE_RELEASE_SIGNING: 'true'
        run: flutter build appbundle --release
