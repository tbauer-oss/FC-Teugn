name: Deploy isolated demo on Google

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-isolated-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_PROJECT: ${{ vars.DEMO_GCP_PROJECT_ID }}
      PRODUCTION_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      DEMO_BUCKET: ${{ vars.DEMO_GCS_BUCKET }}
      DEMO_APP_URL: ${{ vars.DEMO_APP_URL }}
      DEMO_API_BASE_URL: ${{ vars.DEMO_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Require isolated Google resources
        shell: bash
        run: |
          set -euo pipefail
          for name in DEMO_PROJECT DEMO_BUCKET DEMO_APP_URL DEMO_API_BASE_URL; do test -n "${!name}"; done
          test "$DEMO_PROJECT" != "$PRODUCTION_PROJECT"
          [[ "$DEMO_APP_URL" == https://* && "$DEMO_API_BASE_URL" == https://* ]]
          [[ "$DEMO_APP_URL" != *app.fc-teugn-talents.de* && "$DEMO_API_BASE_URL" != *app.fc-teugn-talents.de* ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEMO_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEMO_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate demo backend and isolated database
        working-directory: api
        env:
          DEMO_SEED_PASSWORD: ${{ secrets.DEMO_SEED_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx -y pnpm@10.13.1 install --frozen-lockfile
          npm test
          export APP_ENVIRONMENT=demo
          export DEMO_DATABASE_URL="$(gcloud secrets versions access latest --secret=DEMO_DATABASE_URL --project="$DEMO_PROJECT")"
          echo "::add-mask::$DEMO_DATABASE_URL"
          export DATABASE_URL="$DEMO_DATABASE_URL"
          npx -y pnpm@10.13.1 exec prisma migrate deploy
          npx -y pnpm@10.13.1 run prisma:seed
      - name: Build and deploy isolated Cloud Run backend
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet
          image="europe-west3-docker.pkg.dev/$DEMO_PROJECT/fc-teugn/fc-teugn-backend:$GITHUB_SHA"
          docker build -f api/Dockerfile -t "$image" api
          docker push "$image"
          gcloud run deploy fc-teugn-backend --project "$DEMO_PROJECT" --region europe-west3 \
            --image "$image" --service-account "fc-teugn-runtime@$DEMO_PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8080 --min-instances 0 --max-instances 1 --timeout 300 \
            --set-env-vars "NODE_ENV=production,APP_ENVIRONMENT=demo,OBJECT_STORAGE_BUCKET=$DEMO_BUCKET,FIREBASE_PROJECT_ID=$DEMO_PROJECT,PUBLIC_APP_URL=$DEMO_APP_URL,API_PUBLIC_URL=$DEMO_API_BASE_URL,CORS_ORIGINS=$DEMO_APP_URL" \
            --set-secrets 'DEMO_DATABASE_URL=DEMO_DATABASE_URL:latest,ACCESS_TOKEN_SECRET=ACCESS_TOKEN_SECRET:latest,REFRESH_TOKEN_SECRET=REFRESH_TOKEN_SECRET:latest' --quiet
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
      - name: Build and validate isolated web app
        working-directory: fc_teugn_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --dart-define=APP_ENVIRONMENT=demo --dart-define=API_BASE_URL="$DEMO_API_BASE_URL"
      - name: Deploy isolated Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$DEMO_PROJECT" --non-interactive
          curl --fail --silent --show-error "$DEMO_API_BASE_URL/" | jq -e '.status == "ok" and .environment == "demo"'
