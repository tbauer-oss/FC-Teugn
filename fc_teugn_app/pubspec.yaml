name: fc_teugn_app
description: FC Teugn Talents – die Jugendfußball-App für Team und Verein
publish_to: 'none'
version: 1.6.46+184

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  crypto: ^3.0.7
  dio: ^5.7.0
  go_router: ^14.0.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  image: ^4.9.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  audioplayers: ^6.8.1
  video_player: ^2.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/fc_teugn_logo.png
    - assets/branding/fc_teugn_logo_hires.png
    - assets/branding/fc_teugn_talents_splash.png
    - assets/branding/fc_teugn_talents_mobile_startscreen.png
    - assets/branding/fc_teugn_talents_web_splash.png
    - assets/branding/fc_teugn_talents_icon.png
    - assets/audio/fc_teugn_goal.mp3
    - assets/audio/fc_teugn_opponent_goal.mp3
    - assets/video/fc_teugn_talents_intro.mp4
