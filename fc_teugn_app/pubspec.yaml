name: fc_teugn_app
description: FC Teugn E2/E3 Jugend Team App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^10.3.1
  dio: ^5.7.0
  go_router: ^14.0.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  image: ^4.9.1
  image_picker: ^1.2.3
  flutter_svg: ^2.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/fc_teugn_logo.png
    - assets/branding/fc_teugn_logo.svg
